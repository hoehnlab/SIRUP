name: docs

# Check the committed docs. This job needs no R and no Docker image.
# You build the pages on Discovery with docs/build_docs.sbatch, then commit them.
# This job then does three things:
#   1. It checks that each Rd file has a page and a nav entry.
#   2. It checks that no link in the pages is dead.
#   3. It builds the site with `mkdocs build --strict`.
#   4. It checks that llms.json, llms-full.json, and the skill references are current.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install docs tooling
        run: python3 -m pip install -r docs/requirements.txt
      - name: Check docs
        run: python3 docs/docs_tools.py check
      - name: Check that the llms files and the skill references are current
        run: |
          # The build writes these files from docs/topics, docs/vignettes, man/, and DESCRIPTION.
          # They need no R, so this job can write them again and compare.
          python3 docs/docs_tools.py extras
          git add -A -- llms.txt llms-full.txt llms.json llms-full.json inst/skills/sirup/references
          if ! git diff --cached --quiet; then
            echo "llms.json, llms-full.json, or the skill references are out of date." >&2
            echo "Run 'python3 docs/docs_tools.py extras' (or the full docs build) and commit the result." >&2
            git diff --cached --stat >&2
            exit 1
          fi
