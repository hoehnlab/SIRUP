name: Private rrad integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install-and-check:
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Confirm a clean dependency library
        shell: Rscript {0}
        run: stopifnot(!requireNamespace("rrad", quietly = TRUE))

      - name: Require the private rrad read credential
        env:
          RRAD_READ_TOKEN: ${{ secrets.RRAD_READ_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${RRAD_READ_TOKEN}" ]]; then
            echo "::error::Add a read-only RRAD_READ_TOKEN repository secret."
            exit 1
          fi

      - name: Install the declared dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PAT: ${{ secrets.RRAD_READ_TOKEN }}
        with:
          cache: false
          dependencies: 'c("Depends", "Imports", "LinkingTo")'
          extra-packages: >-
            any::rcmdcheck, any::testthat, any::withr, any::pals

      - name: Verify the pinned native RAD dependency
        shell: Rscript {0}
        run: |
          stopifnot(as.character(packageVersion("rrad")) == "1.2.1")
          info <- rrad::rad_core_info()
          stopifnot(
            isTRUE(info$vendored),
            info$core_api_version == 1L,
            info$resource_schema == 1L,
            all(c(
              "demux", "scan-wl", "reformat", "reformat-fasta",
              "reformat-presto-header", "remote-resource-cache"
            ) %in% info$features)
          )

      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--ignore-vignettes")'
          error-on: '"error"'
