site_name: SIRUP
site_url: https://spairr-sirup.readthedocs.io
repo_url: https://github.com/hoehnlab/SIRUP
edit_uri: edit/main/docs/
theme:
  name: readthedocs
  navigation_depth: 2          # docs_tools.py nav raises this to 3 when Help Topics are grouped
  collapse_navigation: False
  sticky_navigation: False
  locale: en
  titles_only: False
docs_dir: docs
extra_css:
  - css/style_colors.css
# Keep the tooling files in docs/ and the old docs out of the built site.
exclude_docs: |
  *.R
  *.py
  *.sbatch
  *.sh
  *.log
  docs-config.yml
  requirements.txt
  nav-groups.yml
markdown_extensions:
  - def_list
  - md_in_html          # lets a raw HTML block hold Markdown when it has markdown="1"
  - sane_lists
  - smarty
  - pymdownx.arithmatex
  - toc:
      permalink: True
