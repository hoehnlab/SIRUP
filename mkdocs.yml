site_name: SIRUP
site_url: https://sirup.readthedocs.io
repo_url: https://github.com/hoehnlab/SIRUP
edit_uri: edit/main/docs/
theme:
  name: readthedocs
  navigation_depth: 3          # docs_tools.py nav raises this to 3 when Help Topics are grouped
  collapse_navigation: False
  sticky_navigation: False
  locale: en
  titles_only: False
docs_dir: docs
# Keep the tooling files in docs/ and the old docs out of the built site.
exclude_docs: |
  *.R
  *.py
  *.sbatch
  *.log
  docs-config.yml
  requirements.txt
  nav-groups.yml
  readthedocs/
  rrad-equivalence.md
  rrad-equivalence-results.md
markdown_extensions:
  - def_list
  - sane_lists
  - smarty
  - pymdownx.arithmatex
  - toc:
      permalink: True
